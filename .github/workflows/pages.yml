name: test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A healthy run is ~4 min; a stalled Playwright/apt install once hung until
    # the 6h default. Fail fast instead so a transient stall is retryable.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: unit (vitest — pure logic)
        run: npm test
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Cache the browser binary (~100MB) so a slow CDN can't stall every run.
      # apt system libs live outside this cache, so they still install below.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      # No `--with-deps`: that runs apt-get inside the step, and the runner's
      # Azure Ubuntu mirror stalled `apt-get update` for 8+ min (twice, run
      # 32235291730). ubuntu-latest already ships Chromium's shared libs, so
      # install the browser only and skip apt entirely. If e2e ever fails on a
      # missing library, add a targeted `sudo apt-get install -y <lib>` here.
      - name: Install Chromium (browser only)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: e2e (playwright — real layout)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    # deploying an untested board editor would be worse than not deploying
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
